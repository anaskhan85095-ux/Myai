<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Namaste ToonSlee AI</title>
<style>
:root{--bg:#0b0d12;--s1:#12151c;--s2:#1b202b;--bd:#272d3b;--tx:#e8ebf2;--mu:#8b93a7;--ac:#3b82f6;--fs:16px;color-scheme:dark}
:root[data-t=light]{--bg:#fff;--s1:#f5f6f8;--s2:#e9ecf2;--bd:#dde1ea;--tx:#12151c;--mu:#667085;color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;min-width:44px;min-height:44px;border-radius:12px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
header{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--bd)}
header h1{flex:1;font-size:1.05em;display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#6366f1);display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8em;flex:none}
#chat{flex:1;overflow-y:auto;padding:14px 12px}
.w{max-width:760px;margin:0 auto}
.msg{display:flex;flex-direction:column;margin:0 0 14px}.msg.u{align-items:flex-end}
.b{max-width:92%;padding:10px 14px;border-radius:18px;background:var(--s1);border:1px solid var(--bd);overflow-wrap:anywhere}
.u .b{background:var(--ac);border-color:var(--ac);color:#fff;border-bottom-right-radius:6px;white-space:pre-wrap}
.a .b{border-bottom-left-radius:6px}
.dense .msg{margin-bottom:8px}.dense .b{padding:6px 11px}
.ts{display:none;font-size:.7em;color:var(--mu);margin:2px 6px}.showts .ts{display:block}
.acts{display:flex;flex-wrap:wrap}.acts button{min-width:40px;min-height:40px;opacity:.65}.acts button.on{opacity:1;background:var(--s2)}
.b p{margin:.4em 0}.b h1,.b h2,.b h3{margin:.6em 0 .3em;font-size:1.1em}.b ul,.b ol{padding-left:1.3em}
.b pre{background:#0006;border:1px solid var(--bd);border-radius:10px;padding:10px;overflow-x:auto;font-size:.85em;margin:.5em 0}
.b code{font-family:ui-monospace,Menlo,monospace;font-size:.88em}
.b table{border-collapse:collapse;display:block;overflow-x:auto}.b th,.b td{border:1px solid var(--bd);padding:4px 8px}
.err{color:#f87171}.dots{animation:p 1s infinite}@keyframes p{50%{opacity:.3}}
#welcome{text-align:center;margin-top:16vh}#welcome h2{font-size:1.5em;margin:12px 0 6px}#welcome p{color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chips button{border:1px solid var(--bd);background:var(--s1);padding:8px 14px;min-height:40px;font-size:.9em}
footer{padding:8px 10px;border-top:1px solid var(--bd)}
#att{display:flex;gap:6px;flex-wrap:wrap}#att span{background:var(--s2);border-radius:10px;padding:3px 10px;font-size:.8em;margin-bottom:6px}
.bar{display:flex;align-items:flex-end;gap:2px;background:var(--s1);border:1px solid var(--bd);border-radius:24px;padding:4px}
.bar textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:140px;padding:10px 6px}
#send{background:var(--ac);color:#fff;border-radius:50%}
.ov{position:fixed;inset:0;background:#0008;z-index:5;display:none}.ov.on{display:block}
#side{position:fixed;top:0;bottom:0;left:0;width:84%;max-width:330px;background:var(--bg);border-right:1px solid var(--bd);z-index:6;transform:translateX(-102%);transition:transform .25s;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
#side.on{transform:none}
#nc{background:var(--ac);color:#fff;margin:10px 0 8px;font-weight:600}
#sq{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px}
#list{flex:1;overflow-y:auto}.g{font-size:.78em;color:var(--mu);margin:12px 6px 4px}
.ci{display:flex;border-radius:12px}.ci.on{background:var(--s2)}
.ci button:first-child{flex:1;text-align:left;padding:0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci button:last-child{color:var(--mu)}
.bt{display:flex;gap:6px;border-top:1px solid var(--bd);padding-top:6px;align-items:center}.bt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#set{position:fixed;inset:0;background:var(--bg);z-index:8;overflow-y:auto;display:none;padding:env(safe-area-inset-top) 14px calc(20px + env(safe-area-inset-bottom))}#set.on{display:block}
#set h3{font-size:.85em;color:var(--mu);margin:22px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--s1);border:1px solid var(--bd);padding:8px 12px;margin-bottom:6px;border-radius:12px;min-height:48px}
.row.col{flex-direction:column;align-items:stretch}
.row select,.row input[type=text],.row input[type=password],.row textarea{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:8px;max-width:56%}
.row.col select,.row.col input,.row.col textarea{max-width:100%}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.tag{font-size:.75em;background:var(--s2);color:var(--mu);padding:2px 8px;border-radius:8px}
.btn{border:1px solid var(--bd);background:var(--s1);width:100%;margin-bottom:6px;padding:10px}.btn.red{color:#f87171}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;z-index:9;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none}
#sheet.on{display:block}#sheet button{display:block;width:100%;text-align:left;padding:10px 12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--bd);padding:8px 16px;border-radius:20px;z-index:20;display:none;font-size:.9em;max-width:90%}
@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style></head>
<body>
<header><button id="menu" aria-label="Open menu">☰</button><h1><span class="logo">N</span><span>Namaste ToonSlee AI</span></h1><button id="th" aria-label="Switch theme">◐</button><button id="newb" aria-label="New chat">✎</button></header>
<main id="chat"><div class="w" id="msgs"></div></main>
<footer><div class="w"><div id="att"></div><div class="bar">
<button id="clip" aria-label="Attach file">＋</button><textarea id="in" rows="1" placeholder="Message likho…" aria-label="Message"></textarea>
<button id="mic" aria-label="Voice input">🎤</button><button id="send" aria-label="Send">➤</button></div></div>
<input type="file" id="file" hidden multiple accept="image/*,.pdf,.txt,.csv,.md,.json"></footer>
<div class="ov" id="ov"></div>
<aside id="side" aria-label="Chat history"><button id="nc">＋ New chat</button><input id="sq" type="search" placeholder="Search chats" aria-label="Search chats"><div id="list"></div><div class="bt"><span id="who"></span><button id="sb">⚙ Settings</button></div></aside>
<div id="set"></div><div id="sheet"></div><div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script>
const $=s=>document.querySelector(s),API='https://api.anthropic.com/v1/messages',MODEL='claude-sonnet-5-5',K='tsai1';
const DEF={theme:'system',accent:'#3b82f6',fs:'16px',dense:false,name:'',inst:'',pers:'Friendly',lang:'rom',len:'Balanced',voice:'',rate:'1',auto:false,enter:false,ts:false,web:true,key:''};
let D={chats:[],cur:null,s:{}},busy=null,att=[],rec=null,tt;
try{const x=JSON.parse(localStorage.getItem(K));if(x)D=x}catch(e){}
D.s={...DEF,...D.s};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D,(k,v)=>k==='b'?undefined:v))}catch(e){toast('Save nahi hua, storage full ho sakta hai')}};
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=t=>window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t)):esc(t).replace(/\n/g,'<br>');
const cc=()=>D.chats.find(c=>c.id===D.cur);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2400)}
function apply(){const s=D.s,dk=s.theme==='dark'||(s.theme==='system'&&matchMedia('(prefers-color-scheme:dark)').matches),r=document.documentElement;
 r.dataset.t=dk?'dark':'light';r.style.setProperty('--ac',s.accent);r.style.setProperty('--fs',s.fs);
 document.body.classList.toggle('dense',s.dense);document.body.classList.toggle('showts',s.ts);
 $('#who').textContent=s.name||'Guest';$('meta[name=theme-color]').content=dk?'#0b0d12':'#ffffff'}
function sheet(items){const h=$('#sheet');h.innerHTML='';items.forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{closeAll();f()};h.append(b)});h.classList.add('on');$('#ov').classList.add('on')}
function closeAll(){$('#sheet').classList.remove('on');$('#side').classList.remove('on');$('#ov').classList.remove('on')}
$('#ov').onclick=closeAll;
$('#menu').onclick=()=>{list();$('#side').classList.add('on');$('#ov').classList.add('on')};
/* ---------- messages ---------- */
function fill(d,m,i,last){const b=d.querySelector('.b'),c=cc();
 if(m.r==='user')b.textContent=(m.att&&m.att.length?'📎 '+m.att.join(', ')+'\n':'')+m.c;
 else b.innerHTML=(m.c?md(m.c):m.e?'':'<span class="dots">● ● ●</span>')+(m.e?'<p class="err">'+esc(m.e)+'</p>':'');
 d.querySelector('.ts').textContent=new Date(m.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 const a=d.querySelector('.acts');a.innerHTML='';if(busy&&last)return;
 const add=(t,l,f,on)=>{const x=document.createElement('button');x.textContent=t;x.setAttribute('aria-label',l);if(on)x.className='on';x.onclick=f;a.append(x)};
 if(m.r==='user'){add('✎','Edit message',()=>edit(i));add('📋','Copy',()=>copy(m.c));return}
 if(!m.c)return;
 add('📋','Copy',()=>copy(m.c));add('🔊','Read aloud',()=>speak(m.c));
 if(last)add('🔁','Regenerate',()=>{c.msgs.pop();run()});
 add('↗','Share',()=>share(m.c));
 add('👍','Good response',()=>{m.fb=m.fb==='up'?'':'up';save();render()},m.fb==='up');
 add('👎','Bad response',()=>{m.fb=m.fb==='down'?'':'down';save();render()},m.fb==='down');
 add('⋯','More options',()=>sheet([['Copy',()=>copy(m.c)],['Delete message',()=>{c.msgs.splice(i,1);save();render()}]]))}
function render(){const c=cc(),M=$('#msgs');M.innerHTML='';
 if(!c||!c.msgs.length){M.innerHTML='<div id="welcome"><span class="logo" style="width:48px;height:48px;font-size:1.4em;margin:0 auto;border-radius:14px">N</span><h2>Namaste! How can I help you today?</h2><p>Likho, bolo, ya file bhejo.</p><div class="chips"></div></div>';
  ['Aaj ki taaza khabrein batao','Ek chhoti kahani likho','Python mein bubble sort samjhao','Meri CV improve karo'].forEach(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>send(t);M.querySelector('.chips').append(b)});return}
 c.msgs.forEach((m,i)=>{const d=document.createElement('div');d.className='msg '+(m.r==='user'?'u':'a');d.innerHTML='<div class="b"></div><div class="ts"></div><div class="acts"></div>';fill(d,m,i,i===c.msgs.length-1);M.append(d)});
 scroll()}
const scroll=()=>{const e=$('#chat');e.scrollTop=e.scrollHeight};
function copy(t){navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy nahi hua'))}
function share(t){if(navigator.share)navigator.share({text:t}).catch(()=>{});else copy(t);toast('Share link ke liye server chahiye, abhi sirf text share hota hai')}
function edit(i){const c=cc();$('#in').value=c.msgs[i].c;c.msgs.splice(i);save();render();grow();$('#in').focus()}
/* ---------- AI ---------- */
const LN={rom:'Roman Urdu/Hindi in English letters',en:'English',hi:'Hindi in Devanagari script',ur:'Urdu in Urdu script'};
const sys=()=>{const s=D.s;return 'Tum "Namaste ToonSlee AI" ho, ek helpful assistant. '+(s.name?'User ka naam '+s.name+' hai. ':'')+'Reply language: '+LN[s.lang]+'. Style: '+s.pers+'. Length: '+s.len+'. Markdown use kar sakte ho. '+(s.inst?'User instructions: '+s.inst:'')};
function setBusy(b){const s=$('#send');s.textContent=b?'■':'➤';s.setAttribute('aria-label',b?'Stop generating':'Send')}
async function send(t){
 if(busy){busy.abort();return}
 t=(t!==undefined?t:$('#in').value).trim();if(!t&&!att.length)return;
 if(!D.s.key){toast('Pehle Settings mein API key daalo');openSet();return}
 let c=cc();if(!c){c={id:Date.now()+'',title:(t||'File').slice(0,40),ts:Date.now(),msgs:[]};D.chats.unshift(c);D.cur=c.id}
 c.msgs.push({r:'user',c:t||'Is file ka analysis karo.',t:Date.now(),b:att.map(a=>a.b),att:att.map(a=>a.n)});
 $('#in').value='';att=[];attR();grow();run()}
async function run(){
 const c=cc(),m={r:'assistant',c:'',t:Date.now()};c.msgs.push(m);c.ts=Date.now();
 const ac=busy=new AbortController();setBusy(true);render();
 try{
  const msgs=c.msgs.slice(0,-1).filter(x=>x.c).map(x=>({role:x.r,content:x.b&&x.b.length?[...x.b,{type:'text',text:x.c}]:x.c}));
  const body={model:MODEL,max_tokens:4000,stream:true,system:sys(),messages:msgs};
  if(D.s.web)body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:5}];
  const r=await fetch(API,{method:'POST',signal:ac.signal,headers:{'x-api-key':D.s.key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error((e.error&&e.error.message)||'Error '+r.status+'. API key aur internet check karo.')}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='';
  for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
   while((i=buf.indexOf('\n\n'))>=0){const ev=buf.slice(0,i),l=ev.split('\n').find(x=>x.startsWith('data: '));buf=buf.slice(i+2);if(!l)continue;
    let d;try{d=JSON.parse(l.slice(6))}catch(e){continue}
    if(d.type==='error')throw new Error(d.error.message);
    if(d.type==='content_block_delta'&&d.delta.type==='text_delta'){m.c+=d.delta.text;fill($('#msgs').lastElementChild,m,c.msgs.length-1,true);scroll()}}}
 }catch(e){if(e.name!=='AbortError')m.e=e.message==='Failed to fetch'?'Network error. Internet check karo.':e.message}
 busy=null;setBusy(false);if(!m.c&&!m.e)c.msgs.pop();save();render();list();if(D.s.auto&&m.c)speak(m.c)}
/* ---------- chats ---------- */
function newChat(){D.cur=null;save();render();closeAll();$('#in').focus()}
function list(){const q=$('#sq').value.toLowerCase(),L=$('#list'),t0=new Date().setHours(0,0,0,0),G={Pinned:[],Aaj:[],Kal:[],Pehle:[],Archived:[]};L.innerHTML='';
 D.chats.filter(c=>!q||c.title.toLowerCase().includes(q)||c.msgs.some(m=>m.c.toLowerCase().includes(q))).sort((a,b)=>b.ts-a.ts).forEach(c=>(c.arch?G.Archived:c.pin?G.Pinned:c.ts>=t0?G.Aaj:c.ts>=t0-864e5?G.Kal:G.Pehle).push(c));
 for(const g in G){if(!G[g].length)continue;L.insertAdjacentHTML('beforeend','<div class="g">'+g+'</div>');
  G[g].forEach(c=>{const r=document.createElement('div'),a=document.createElement('button'),m=document.createElement('button');r.className='ci'+(c.id===D.cur?' on':'');
   a.textContent=(c.pin?'📌 ':'')+c.title;a.onclick=()=>{D.cur=c.id;save();closeAll();render()};
   m.textContent='⋯';m.setAttribute('aria-label','Chat options');m.onclick=()=>sheet([
    ['Rename',()=>{const n=prompt('Chat ka naam',c.title);if(n&&n.trim()){c.title=n.trim().slice(0,60);save();list()}}],
    [c.pin?'Unpin':'Pin',()=>{c.pin=!c.pin;save();list()}],
    [c.arch?'Unarchive':'Archive',()=>{c.arch=!c.arch;save();list()}],
    ['Delete',()=>{if(confirm('Ye chat delete karni hai?')){D.chats=D.chats.filter(x=>x!==c);if(D.cur===c.id)D.cur=null;save();list();render()}}]]);
   r.append(a,m);L.append(r)})}
 if(!L.children.length)L.innerHTML='<div class="g">Abhi koi chat nahi</div>'}
$('#sq').oninput=list;$('#nc').onclick=newChat;$('#newb').onclick=newChat;
$('#th').onclick=()=>{D.s.theme=document.documentElement.dataset.t==='dark'?'light':'dark';apply();save()};
/* ---------- composer ---------- */
const grow=()=>{const e=$('#in');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,140)+'px'};
$('#in').oninput=grow;
$('#in').onkeydown=e=>{if(e.key==='Enter'&&D.s.enter&&!e.shiftKey){e.preventDefault();send()}};
$('#send').onclick=()=>send();
const b64=f=>new Promise((o,j)=>{const r=new FileReader();r.onload=()=>o(r.result.split(',')[1]);r.onerror=j;r.readAsDataURL(f)});
function attR(){const A=$('#att');A.innerHTML='';att.forEach((a,i)=>{const s=document.createElement('span');s.textContent='📎 '+a.n+' ✕';s.onclick=()=>{att.splice(i,1);attR()};A.append(s)})}
$('#clip').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{for(const f of e.target.files){try{
 if(att.length>=3){toast('Ek baar mein 3 file tak');break}
 if(f.type.startsWith('image/')){if(f.size>3.5e6){toast(f.name+' badi hai (3.5 MB tak)');continue}att.push({n:f.name,b:{type:'image',source:{type:'base64',media_type:f.type,data:await b64(f)}}})}
 else if(f.type==='application/pdf'){if(f.size>15e6){toast('PDF 15 MB tak chalti hai');continue}att.push({n:f.name,b:{type:'document',source:{type:'base64',media_type:'application/pdf',data:await b64(f)}}})}
 else if(/^text\/|json$/.test(f.type)||/\.(txt|csv|md|json)$/i.test(f.name))att.push({n:f.name,b:{type:'text',text:'File: '+f.name+'\n\n'+(await f.text()).slice(0,60000)}});
 else toast(f.name+': ye type support nahi hai')}catch(x){toast('File padh nahi payi')}}
 e.target.value='';attR()};
/* ---------- voice ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition,TL={rom:'hi-IN',en:'en-IN',hi:'hi-IN',ur:'ur-PK'};
$('#mic').onclick=()=>{if(!SR){toast('Is browser mein voice input nahi hai. Chrome use karo.');return}
 if(rec){rec.stop();return}
 rec=new SR();rec.lang=TL[D.s.lang];rec.interimResults=true;
 rec.onresult=e=>{$('#in').value=[...e.results].map(r=>r[0].transcript).join(' ');grow()};
 rec.onerror=e=>toast(e.error==='not-allowed'?'Mic ki permission allow karo':'Mic error: '+e.error);
 rec.onend=()=>{rec=null;$('#mic').textContent='🎤'};rec.start();$('#mic').textContent='⏹'};
function speak(t){const u=window.speechSynthesis;if(!u){toast('Is browser mein read-aloud nahi hai');return}
 if(u.speaking){u.cancel();return}
 const x=new SpeechSynthesisUtterance(t.replace(/[*#_`>|]/g,'')),v=u.getVoices().find(v=>v.name===D.s.voice);
 x.rate=+D.s.rate;x.lang=TL[D.s.lang==='rom'?'en':D.s.lang];if(v)x.voice=v;u.speak(x)}
/* ---------- settings ---------- */
const CF=[['Appearance',[['theme','Theme','s',[['system','System'],['dark','Dark'],['light','Light']]],['accent','Accent colour','s',[['#3b82f6','Blue'],['#8b5cf6','Violet'],['#10b981','Green'],['#f59e0b','Amber']]],['fs','Font size','s',[['14px','Small'],['16px','Medium'],['18px','Large']]],['dense','Compact chat','t']]],
['Personalization',[['name','Display name','x'],['pers','AI personality','s',['Professional','Friendly','Creative','Concise'].map(x=>[x,x])],['lang','Preferred language','s',[['rom','Roman Urdu/Hindi'],['en','English'],['hi','Hindi (देवनागरी)'],['ur','Urdu (اردو)']]],['len','Response length','s',['Short','Balanced','Detailed'].map(x=>[x,x])],['inst','Custom AI instructions','a']]],
['Voice',[['voice','Voice','v'],['rate','Speech speed','r'],['auto','Auto-play responses','t']]],
['Chat',[['enter','Enter to send','t'],['ts','Show timestamps','t'],['web','Web search','t']]],
['Privacy and API',[['key','Anthropic API key (sirf is phone mein save hoti hai)','p']]]];
function openSet(){const S=$('#set'),w=document.createElement('div');w.className='w';S.innerHTML='';
 const bk=document.createElement('button');bk.textContent='← Back';bk.onclick=()=>{S.classList.remove('on');render()};w.append(bk,Object.assign(document.createElement('h2'),{textContent:'Settings'}));
 CF.forEach(([g,rows])=>{w.append(Object.assign(document.createElement('h3'),{textContent:g}));
